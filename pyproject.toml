[build-system]
requires = ["setuptools>=61.0", "cffi>=1.17.1"]
build-backend = "setuptools.build_meta"

[project]
name = "soundobj"
version = "0.3.0"
description = "Lightweight full-featured audio playback in Python, built on Miniaudio"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Carter Temm", email = "cartertemm@gmail.com" }
]
keywords = ["audio", "sound", "playback", "miniaudio", "3d-audio", "spatial-audio", "ogg", "opus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
requires-python = ">=3.13"
dependencies = ["cffi>=1.17.1"]

[project.urls]
Repository = "https://github.com/cartertemm/soundobj"
"Bug Tracker" = "https://github.com/cartertemm/soundobj/issues"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["soundobj"]

[tool.cibuildwheel]
build = "cp313-*"
# 32-bit and musl builds are not supported
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-all = "python {project}/vcpkg.py"

[tool.cibuildwheel.linux]
# vcpkg installs the native deps inside the project dir; the manylinux container
# mounts the project directory so vcpkg_installed persists across builds.
# Subsequent builds will be much faster once vcpkg has already run.
# manylinux2014 (CentOS 7) is missing several build prerequisites:
#   - zip: required by vcpkg bootstrap and binary caching
#   - ninja-build: vcpkg's own prebuilt ninja needs a newer libstdc++ than CentOS 7
#     ships, so VCPKG_FORCE_SYSTEM_BINARIES makes vcpkg use the system cmake/ninja
#   - perl-IPC-Cmd/Data-Dumper/Time-Piece + kernel-headers: needed to build openssl (via curl[ssl])
# The env var is set globally (not just here) because the wheel build also runs vcpkg via build_ffi.py.
environment = { VCPKG_FORCE_SYSTEM_BINARIES = "1" }
before-all = "yum install -y zip ninja-build perl-IPC-Cmd perl-Data-Dumper perl-Time-Piece kernel-headers && python3 {project}/vcpkg.py"

[tool.cibuildwheel.macos]
# macos-13 (x86_64) and macos-latest (arm64) runners each build their native arch.
# vcpkg provides all native deps including miniaudio, which brew does not package.
before-all = "python3 {project}/vcpkg.py"
